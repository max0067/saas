{% extends "base.html" %}

{% block title %}Éditer Semaine {{ week.week_number }} - {{ product.title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">Semaine {{ week.week_number }} - {{ product.title }}</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Titre de la semaine</label>
                    <input type="text" name="title" class="form-control" value="{{ week.title }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="4">{{ week.description or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Objectifs de la semaine</label>
                    <textarea name="goals" class="form-control" rows="3">{{ week.goals or '' }}</textarea>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-2"></i>Enregistrer
            </button>
            <a href="{{ url_for('admin_programs.edit', product_id=product.id) }}" class="btn btn-outline-secondary">Retour</a>
        </div>
    </form>
</div>
{% endblock %}
